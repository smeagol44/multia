<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="referrer" content="no-referrer">
  <meta name="multia-api" content="__MULTIA_API__">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'self' __MULTIA_CONNECT__; base-uri 'none'; object-src 'none'; form-action 'none'">
  <title>MultiA</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <main id="gate" class="gate">
    <div class="sign-in">
      <div class="brand"><span class="brand-icon" data-icon="brand"></span> MultiA</div>
      <div class="gate-content">
        <div class="avatar-row" aria-hidden="true">
          <span class="avatar gpt" data-icon="gpt"></span>
          <span class="avatar claud" data-icon="claud"></span>
        </div>
        <h1>Unlock MultiA</h1>
        <p class="muted">Your private chat with ChatGPT and Claude.</p>
        <form id="login">
          <label for="password">App password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
          <button class="primary" type="submit">Unlock</button>
        </form>
        <p class="notice" id="login-status" role="status"></p>
        <a id="setup-link" hidden href="https://github.com/smeagol44/multia#deploy" rel="noreferrer" target="_blank">Backend setup instructions</a>
      </div>
    </div>
  </main>

  <div class="workspace" id="workspace" hidden>
    <button id="scrim" type="button" class="scrim" aria-label="Close chat list" hidden></button>
    <aside id="sidebar" class="sidebar" aria-label="Chats">
      <div class="sidebar-top">
        <div class="brand"><span class="brand-icon" data-icon="brand"></span> MultiA</div>
        <button id="new-chat" type="button" class="new-chat"><span data-icon="plus"></span> New chat</button>
      </div>
      <div class="sidebar-label">Chats</div>
      <nav id="chat-list" aria-label="Saved chats"></nav>
      <div class="sidebar-bottom">
        <button id="appearance" type="button" class="text-button"><span data-icon="palette"></span> Appearance</button>
        <button id="lock" type="button" class="text-button"><span data-icon="lock"></span> Lock app</button>
      </div>
    </aside>

    <main class="conversation">
      <header class="chat-header">
        <div class="chat-heading">
          <button id="open-sidebar" aria-expanded="false" aria-controls="sidebar" type="button" class="icon-button menu-button" aria-label="Open chat list" data-icon="menu"></button>
          <h1 id="chat-title">New chat</h1>
          <button id="chat-settings" type="button" class="icon-button" aria-label="Chat settings" title="Chat settings" data-icon="more"></button>
        </div>
        <button id="toggle-activity" aria-label="Activity" type="button" class="text-button activity-button" aria-expanded="false" aria-controls="activity"><span data-icon="pulse"></span> <span>Activity</span></button>
      </header>

      <div class="members" id="members" aria-label="AI participants"></div>

      <section id="history" class="history" aria-label="Chat transcript" tabindex="0">
        <div class="history-inner" id="message-list"></div>
      </section>

      <div class="compose-area">
        <p class="notice" id="chat-status" role="status" hidden></p>
        <form id="compose" class="compose">
          <textarea id="message" aria-label="Message" rows="2" placeholder="Message the group…"></textarea>
          <div class="compose-tools">
            <div class="format-tools" aria-label="Formatting">
              <button type="button" data-format="bold" class="icon-button" aria-label="Bold" title="Bold"><strong>B</strong></button>
              <button type="button" data-format="italic" class="icon-button" aria-label="Italic" title="Italic"><i>I</i></button>
              <button type="button" data-format="underline" class="icon-button" aria-label="Underline" title="Underline"><u>U</u></button>
              <button type="button" data-format="link" class="icon-button" aria-label="Insert link" title="Insert link" data-icon="link"></button>
            </div>
            <div class="mention-tools" aria-label="Mention an AI">
              <button type="button" data-mention="@gpt" class="mention gpt">@gpt</button>
              <button type="button" data-mention="@claud" class="mention claud">@claud</button>
            </div>
            <div class="send-tools">
              <button id="stop" type="button" class="icon-button stop-button" aria-label="Stop replies" title="Stop replies" data-icon="stop" hidden></button>
              <button id="send" type="submit" class="primary send-button" aria-label="Send message" title="Send message" data-icon="send"></button>
            </div>
          </div>
        </form>
      </div>
    </main>

    <aside id="activity" class="activity" aria-labelledby="activity-title" hidden>
      <header><h2 id="activity-title">Activity</h2><button id="close-activity" class="icon-button" type="button" aria-label="Close activity" data-icon="close"></button></header>
      <p class="muted activity-explanation">Only you can see these updates.</p>
      <div id="activity-list"></div>
    </aside>
  </div>

  <dialog id="settings-dialog" aria-labelledby="settings-title">
    <form id="settings-form">
      <div class="dialog-head"><h2 id="settings-title">Chat settings</h2><button type="button" class="icon-button" data-close data-icon="close" aria-label="Close"></button></div>
      <label for="chat-name">Chat name</label>
      <input id="chat-name" maxlength="80" required>
      <div class="field-header"><label for="instructions">Chat instructions</label><output for="instructions" id="instruction-count"></output></div>
      <textarea id="instructions" rows="6" maxlength="2500" placeholder="Tell both AIs how to work in this chat."></textarea>
      <div class="dialog-actions">
        <button type="button" class="secondary" id="duplicate">Duplicate</button>
        <button type="button" class="danger" id="delete">Delete</button>
        <button class="primary" type="submit">Save</button>
      </div>
      <p class="notice" data-dialog-status role="status" hidden></p>
    </form>
  </dialog>

  <dialog id="provider-dialog" aria-labelledby="provider-title">
    <form id="provider-form">
      <div class="dialog-head"><h2 id="provider-title"></h2><button type="button" class="icon-button" data-close data-icon="close" aria-label="Close"></button></div>
      <label for="model">Model</label><select id="model"></select>
      <label for="effort">Thinking effort</label>
      <select id="effort"><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option></select>
      <div class="dialog-actions"><button class="primary" type="submit">Save</button></div>
      <p class="notice" data-dialog-status role="status" hidden></p>
    </form>
  </dialog>

  <dialog id="usage-dialog" aria-labelledby="usage-title">
    <div class="dialog-body">
      <div class="dialog-head"><h2 id="usage-title"></h2><button type="button" class="icon-button" data-close data-icon="close" aria-label="Close"></button></div>
      <div id="usage-detail"></div>
      <a id="usage-url" target="_blank" rel="noopener noreferrer">Open provider dashboard <span aria-hidden="true">↗</span></a>
    </div>
  </dialog>

  <dialog id="appearance-dialog" aria-labelledby="appearance-title">
    <form id="appearance-form">
      <div class="dialog-head"><h2 id="appearance-title">Appearance</h2><button type="button" class="icon-button" data-close data-icon="close" aria-label="Close"></button></div>
      <label for="theme">Theme</label>
      <select id="theme"><option value="graphite">Graphite</option><option value="plum">Plum</option><option value="light">Light</option></select>
      <label for="accent">Accent</label>
      <select id="accent"><option value="violet">Violet</option><option value="mint">Mint</option><option value="blue">Blue</option><option value="amber">Amber</option></select>
      <div class="dialog-actions"><button class="primary" type="submit">Save</button></div>
      <p class="notice" data-dialog-status role="status" hidden></p>
    </form>
  </dialog>
</body>
</html>
